name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stockradar
          POSTGRES_PASSWORD: stockradar
          POSTGRES_DB: stockradar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stockradar"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://stockradar:stockradar@localhost:5432/stockradar
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependencias
        run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (formato)
        run: uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Pruebas con cobertura (mínimo 80 %)
        run: |
          uv run coverage run -m pytest
          uv run coverage report
          uv run coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  docker:
    runs-on: ubuntu-latest
    needs: quality-and-tests
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: stockradar:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
